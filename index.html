<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fantastic World — Composition Greybox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#2f3f9d;overflow:hidden;
    font-family:ui-monospace,Menlo,monospace}
  canvas{position:fixed;inset:0;display:block}
  /* overlay = canonical portrait composition-safe area, centred; sized by JS */
  #overlay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    pointer-events:none;opacity:.5;display:none;z-index:5}
  #ui{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center;
    background:rgba(20,25,70,.72);border:1px solid rgba(247,220,194,.25);
    border-radius:8px;padding:8px 10px;color:#f7dcc2;font-size:11px;z-index:10}
  #ui button{background:none;border:1px solid rgba(247,220,194,.45);color:#f7dcc2;
    border-radius:5px;padding:3px 8px;font:inherit;cursor:pointer}
  #ui button.on{background:#f7dcc2;color:#2f3f9d}
  #ui input[type=range]{width:80px;accent-color:#f7dcc2}
  #hint{position:fixed;bottom:10px;right:14px;color:rgba(247,220,194,.45);
    font-size:10px;z-index:10}
</style>
</head>
<body>
<img id="overlay" src="poster.png" alt="">
<div id="ui">
  <button id="btnOverlay">poster&nbsp;[O]</button>
  <input id="opacity" type="range" min="0" max="100" value="50">
</div>
<div id="hint">move mouse for parallax</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ================= palette (sampled from poster) ================= */
const P = {
  bg:'#2f3f9d', bgDeep:'#27338a', navy:'#29368e',
  azure:'#4c91d8', azureDeep:'#3d7ec6', azureTop:'#5da0e0',
  cream:'#f7dcc2', creamDeep:'#eecb9f',
  salmon:'#f99d8b', salmonDeep:'#e07f6e', salmonTop:'#fbafa0',
  blush:'#f5a9a4', blushDeep:'#df8b8a',
  mint:'#7ccdc3', mintDeep:'#4fb0a6', mintTop:'#93d9d0',
  jade:'#45b3a5',
  lilac:'#b689cf', lilacDeep:'#9a6cbd', lilacTop:'#c69ada',
  peach:'#f9d8bd', peachDeep:'#edc49c', peachTop:'#fbe4d0',
  yellow:'#f5c266', yellowDeep:'#e3a24a', yellowTop:'#f9d184',
  coral:'#f08160',
  mauve:'#8464b4', mauveLight:'#9d79c9', mauvePale:'#b493d6',
  cardA:'#7a68b8', cardB:'#6957a8',
  sun:'#fbc25e', pinkSun:'#ec7f93',
};
THREE.ColorManagement.enabled = false;           // exact-hex pipeline, no conversions
const C = h => new THREE.Color(h);

/* ============ camera constants (hoisted: scene placement needs them) ============ */
const CANON = 2/3;                                // canonical poster aspect
const LOOK = new THREE.Vector3(0.2,4.6,0.4);
const DIST = 46, ORTHO_H = 21.5;
const base = {az:0.30, el:0.175};
const FRUS_W = ORTHO_H*CANON, FRUS_H = ORTHO_H;
const cosAz=Math.cos(base.az), sinAz=Math.sin(base.az);
const cosEl=Math.cos(base.el), sinEl=Math.sin(base.el);

/* posterAt: poster pixel (724x1086) -> world position at chosen depth z,
   inverse-projected through the canonical home camera. The whole composition
   is authored in poster coordinates so the macro layout derives from the artwork. */
function posterAt(px,py,z){
  const sx=(px/724-0.5)*FRUS_W, sy=(0.5-py/1086)*FRUS_H;
  return new THREE.Vector3(
    LOOK.x + (sx + sinAz*(z-LOOK.z))/cosAz,
    LOOK.y + (sy + sinEl*(z-LOOK.z))/cosEl,
    z);
}
const PX = FRUS_W/724;                            // 1 poster pixel in world units

/* ================= renderer ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = C(P.bg);

/* ================= shared GLSL ================= */
const NOISE = /* glsl */`
  float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vnoise(p);p*=2.03;a*=.5;}return v;}
`;

/* ============ flat two-tone "screen print" material (approved lookdev) ============ */
const DEPTH_TINT = C('#5c55ae');
function flatMat(front, side, top, opts = {}) {
  side = side || front; top = top || front;
  return new THREE.ShaderMaterial({
    uniforms:{
      uFront:{value:C(front)}, uSide:{value:C(side)}, uTop:{value:C(top)},
      uSideDir:{value:new THREE.Vector3(1,0,-0.18).normalize()},
      uDepthCol:{value:DEPTH_TINT},
      uDepthAmt:{value:opts.depth ?? 0.0},
      uMottle:{value:opts.mottle ?? 0.05},
    },
    side: opts.doubleSide ? THREE.DoubleSide : THREE.FrontSide,
    vertexShader:/* glsl */`
      varying vec3 vN; varying vec3 vW; varying float vZ;
      void main(){
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
        vec4 mv = viewMatrix * w; vZ = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:/* glsl */`
      varying vec3 vN; varying vec3 vW; varying float vZ;
      uniform vec3 uFront,uSide,uTop,uSideDir,uDepthCol;
      uniform float uDepthAmt,uMottle;
      ${NOISE}
      void main(){
        vec3 n = normalize(vN);
        float topW  = smoothstep(0.55,0.68,n.y);
        float sideW = smoothstep(0.22,0.34,dot(n,uSideDir))*(1.0-topW);
        vec3 col = mix(uFront,uSide,sideW); col = mix(col,uTop,topW);
        col *= 1.0 + (fbm(vW.xy*0.5 + vW.zx*0.31) - 0.5)*uMottle;
        float dz = clamp((vZ-34.0)/26.0, 0.0, 1.0);
        col = mix(col, uDepthCol, dz*uDepthAmt);
        gl_FragColor = vec4(col,1.0);
      }`
  });
}
/* material cache so colour combos are shared */
const _mc={};
function mat(f,s,t,opts){ const k=f+'|'+s+'|'+t+'|'+JSON.stringify(opts||{});
  return _mc[k] ?? (_mc[k]=flatMat(f,s,t,opts)); }

/* palette combos for architecture (hand-picked pairs, poster-derived) */
const M = {
  azure : ()=>mat(P.azure,P.azureDeep,P.azureTop),
  salmon: ()=>mat(P.salmon,P.salmonDeep,P.salmonTop),
  blush : ()=>mat(P.blush,P.blushDeep,'#f8bcb6'),
  mint  : ()=>mat(P.mint,P.mintDeep,P.mintTop),
  jade  : ()=>mat(P.jade,'#379a8d','#55c2b4'),
  lilac : ()=>mat(P.lilac,P.lilacDeep,P.lilacTop),
  peach : ()=>mat(P.peach,P.peachDeep,P.peachTop),
  yellow: ()=>mat(P.yellow,P.yellowDeep,P.yellowTop),
  coral : ()=>mat(P.coral,'#d96a4d','#f49577'),
  cream : ()=>mat(P.cream,P.creamDeep,'#fae6d2'),
  navyF : ()=>mat(P.navy,P.navy,P.navy),
  creamF: ()=>mat(P.cream,P.cream,P.cream),
  pink  : ()=>mat(P.pinkSun,'#d96a80','#f09aa8'),
};
const EPS=0.012;

/* ================= geometry helpers (approved) ================= */
function archShape(w,h){
  const s=new THREE.Shape(), r=w/2;
  s.moveTo(-r,0); s.lineTo(-r,h-r); s.absarc(0,h-r,r,Math.PI,0,true); s.lineTo(r,0); s.closePath();
  return s;
}
function archedWall(w,h,d,arches){
  const s=new THREE.Shape();
  s.moveTo(-w/2,0); s.lineTo(-w/2,h); s.lineTo(w/2,h); s.lineTo(w/2,0); s.closePath();
  for(const a of arches){
    const p=new THREE.Path(), r=a.w/2, cx=a.x;
    p.moveTo(cx-r,0); p.lineTo(cx-r,a.h-r); p.absarc(cx,a.h-r,r,Math.PI,0,true); p.lineTo(cx+r,0); p.closePath();
    s.holes.push(p);
  }
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});
  g.translate(0,0,-d/2);
  return g;
}
function archPlane(w,h){ return new THREE.ShapeGeometry(archShape(w,h)); }
function archTrim(w,h,t){
  const outer=archShape(w+2*t,h+t);
  const innerPts=archShape(w,h).getPoints(24);
  const hole=new THREE.Path(); hole.setFromPoints(innerPts); hole.closePath();
  outer.holes.push(hole);
  return new THREE.ShapeGeometry(outer);
}
function blobShape(rx,rz,seed,irr=0.3){
  const s=new THREE.Shape(); const N=14;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const j=1+irr*(Math.sin(a*3+seed)*0.5+Math.sin(a*5+seed*2.7)*0.3);
    const x=Math.cos(a)*rx*j, y=Math.sin(a)*rz*j;
    if(i===0)s.moveTo(x,y); else s.lineTo(x,y);
  }
  return new THREE.ShapeGeometry(s,24);
}
function mountain(w,h,bumps,seed){
  const s=new THREE.Shape(); s.moveTo(-w/2,0);
  let x=-w/2;
  for(let i=0;i<bumps;i++){
    const bw=w/bumps, r1=Math.sin(seed+i*2.7)*0.5+0.5, r2=Math.sin(seed*1.7+i*1.3)*0.5+0.5;
    s.quadraticCurveTo(x+bw*(0.2+0.3*r1), h*(0.55+0.45*r2), x+bw, h*(0.18+0.4*r1));
    x+=bw;
  }
  s.lineTo(w/2,0); s.closePath();
  return new THREE.ShapeGeometry(s);
}

const world = new THREE.Group(); scene.add(world);
/* swept tube along a spline — instrument tubing workhorse */
function tubeAlong(pts,r,m,closed=false,seg=64){
  const c=new THREE.CatmullRomCurve3(pts,closed,'centripetal',0.5);
  const t=new THREE.Mesh(new THREE.TubeGeometry(c,seg,r,10,closed),m);
  world.add(t); return t;
}
function put(geo,m,x,y,z,ry=0,rz=0,parent=world){
  const msh=new THREE.Mesh(geo,m); msh.position.set(x,y,z);
  msh.rotation.y=ry; msh.rotation.z=rz; parent.add(msh); return msh;
}

/* ============ modular building kit (variation, not repetition) ============ */
/* house: body + roof + door/window, many variants; used with hand-authored params */
function mkHouse(o){
  const g=new THREE.Group();
  const w=o.w??1, h=o.h??1.4, d=o.d??0.9;
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), o.body); body.position.y=h/2; g.add(body);
  const rt=o.roof??'flat';
  if(rt==='flat'){
    const r=new THREE.Mesh(new THREE.BoxGeometry(w*1.14,h*0.09+0.05,d*1.14), o.rMat??M.cream());
    r.position.y=h+0.04; g.add(r);
  }else if(rt==='cone'){
    const r=new THREE.Mesh(new THREE.ConeGeometry(w*0.62,h*0.5,4+((o.seed??0)%3)*4), o.rMat??M.coral());
    r.position.y=h+h*0.24; r.rotation.y=0.4; g.add(r);
  }else if(rt==='dome'){
    const r=new THREE.Mesh(new THREE.SphereGeometry(w*0.5,14,10,0,Math.PI*2,0,Math.PI/2), o.rMat??M.pink());
    r.scale.y=1.25; r.position.y=h; g.add(r);
  }
  if(o.door){
    const dr=new THREE.Mesh(archPlane(w*0.34,h*0.5), M.navyF()); dr.position.set(0,0,d/2+EPS); g.add(dr);
    const tr=new THREE.Mesh(archTrim(w*0.34,h*0.5,w*0.05), M.creamF()); tr.position.set(0,0,d/2+EPS/2); g.add(tr);
  }
  if(o.win){
    for(let i=0;i<o.win;i++){
      const wx=(i-(o.win-1)/2)*w*0.4;
      const wn=new THREE.Mesh(archPlane(w*0.16,h*0.2), o.winMat??M.creamF());
      wn.position.set(wx,h*0.55,d/2+EPS); g.add(wn);
    }
  }
  if(o.p){ g.position.copy(o.p); }
  g.rotation.y=o.ry??0; g.scale.setScalar(o.s??1);
  world.add(g); return g;
}
function mkStairs(n,sw,sh,sd,m,parent=world){
  const g=new THREE.Group();
  for(let i=0;i<n;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(sw*1.12,sh,sd*(1-i*0.03)),m);
    b.position.set(i*sw*0.95, sh/2+i*sh, -i*sd*0.06);
    b.rotation.y=Math.sin(i*2.1)*0.03; g.add(b);
  }
  parent.add(g); return g;
}

/* ================================================================
   ZONES — authored from the poster (px,py are poster pixels)
   ================================================================ */

/* ---------- environment: sky, mountains, celestial bodies ---------- */
{
  const far={depth:0.55,mottle:0.04};
  put(mountain(96,6.5,7,1.2), mat(P.mauvePale,P.mauvePale,P.mauvePale,far), -10.2,2.0,-34);
  put(mountain(84,5.6,6,4.8), mat(P.mauveLight,P.mauveLight,P.mauveLight,{depth:0.35,mottle:0.04}), -9.0,2.25,-30);
  put(mountain(72,4.6,5,9.1), mat(P.mauve,P.mauve,P.mauve,{depth:0.2,mottle:0.05}), -4.9,2.4,-26);
  /* celestial counterweights — poster (612,112) yellow, (545,208) pink */
  const sunP=posterAt(612,112,-31);
  put(new THREE.CircleGeometry(1.55,48), mat(P.sun,P.sun,P.sun), sunP.x,sunP.y,sunP.z);
  const pkP=posterAt(545,208,-30.5);
  put(new THREE.CircleGeometry(0.85,48), mat(P.pinkSun,P.pinkSun,P.pinkSun), pkP.x,pkP.y,pkP.z);
}

/* ---------- ground pools (anchor the city masses) ---------- */
{
  const pool=(rx,rz,seed,irr,col,x,y,z)=>{
    const b=put(blobShape(rx,rz,seed,irr), mat(col,col,col,{mottle:0.07}), x,y,z);
    b.rotation.x=-Math.PI/2; return b;
  };
  pool(7.0,4.6,2.1,0.22,P.azure,      2.2,0.02, 1.6);   // under right city
  pool(4.5,3.2,7.7,0.26,P.azure,     -3.6,0.02, 2.4);   // under horn city
  pool(3.4,2.5,5.7,0.30,P.mauveLight,-6.2,0.015,4.4);
  /* lateral continuation for wide viewports */
  pool(5.2,3.4,8.3,0.26,P.azure,    -15.5,0.02, 5.2);
  pool(3.6,2.4,3.9,0.32,P.mauveLight,12.8,0.015,3.0);
  pool(4.6,2.8,6.6,0.24,P.azure,     16.5,0.02,-0.8);
}

/* ---------- dry-brush ribbon builder (approved treatment, parametrised) ---------- */
function buildRibbon(pts, wStart, wEnd, powr, colors){
  const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',0.5);
  const N=280, up=new THREE.Vector3(0,1,0);
  const pos=[],uvs=[],idx=[];
  let arc=0, prev=curve.getPoint(0);
  for(let i=0;i<=N;i++){
    const t=i/N, p=curve.getPoint(t), tan=curve.getTangent(t);
    arc+=p.distanceTo(prev); prev=p.clone();
    const bin=new THREE.Vector3().crossVectors(up,tan).normalize();
    const wHalf=(wStart+(wEnd-wStart)*Math.pow(t,powr))/2;
    const a=p.clone().addScaledVector(bin, wHalf);
    const b=p.clone().addScaledVector(bin,-wHalf);
    pos.push(a.x,a.y,a.z,b.x,b.y,b.z);
    uvs.push(0,arc, 1,arc);
    if(i<N){const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.ShaderMaterial({
    side:THREE.DoubleSide,
    uniforms:{
      uBase:{value:C(colors.base)}, uDeep:{value:C(colors.deep)},
      uStaff:{value:C('#7ea6cf')}, uStaffOn:{value:colors.staff?1.0:0.0},
      uEdgeCol:{value:C(P.cream)}, uEdgeOn:{value:colors.edge?1.0:0.0},
      uTubeOn:{value:colors.tube?1.0:0.0},
    },
    vertexShader:/* glsl */`
      varying vec2 vUv;
      void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:/* glsl */`
      varying vec2 vUv;
      uniform vec3 uBase,uDeep,uStaff,uEdgeCol; uniform float uStaffOn,uEdgeOn,uTubeOn;
      ${NOISE}
      void main(){
        float u=vUv.x, v=vUv.y;
        float e=min(u,1.0-u);
        float edgeN = fbm(vec2(v*1.9, u*6.0));
        float rag   = 0.045 + 0.13*edgeN;
        if(e < rag){
          float t=e/rag;
          float grainy=fbm(vec2(v*14.0, u*40.0));
          if(t < grainy*0.9) discard;
        }
        float fleck=hash(vec2(floor(v*34.0),floor(u*26.0)));
        if(e<0.20 && fleck>0.86 && vnoise(vec2(v*9.0,u*9.0))>0.45) discard;
        vec3 col=uBase;
        float streak=fbm(vec2(v*0.85,u*7.0));
        col=mix(col,uDeep,smoothstep(0.55,0.9,streak)*0.55);
        col*=1.0+(fbm(vec2(v*3.1,u*11.0))-0.5)*0.10;
        /* subtle cylindrical body shading — the road is secretly a flute tube */
        if(uTubeOn>0.5){
          float c=abs(u-0.5)*2.0;
          col=mix(col,uDeep,c*c*0.40);
          col=mix(col,vec3(1.0),smoothstep(0.25,0.0,abs(u-0.34))*0.06);
        }
        /* cream dry-brush edging (flute road treatment) */
        if(uEdgeOn>0.5){
          float band=1.0-smoothstep(rag+0.02,rag+0.11,e);
          col=mix(col,uEdgeCol,band*0.8);
        }
        /* faint staff lines (music-road identity) */
        if(uStaffOn>0.5){
          float lines=0.0;
          for(int i=0;i<5;i++){
            float lu=0.30+0.10*float(i);
            float dd=abs(u-lu);
            float wob=(vnoise(vec2(v*2.2,float(i)*7.3))-0.5)*0.012;
            lines=max(lines,(1.0-smoothstep(0.004,0.010,dd+wob)));
          }
          float fade=smoothstep(0.0,0.12,fract(v*0.023))*(0.35+0.4*fbm(vec2(v*1.2,3.7)));
          col=mix(col,uStaff,lines*0.5*fade);
        }
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const mesh=new THREE.Mesh(g,m); world.add(mesh); return mesh;
}

/* ---------- ZONE 1: conductor origin + great staff ribbon ----------
   Rises from the conductor at the bottom, past the horn city, dissolving
   behind the central core — the poster's main left-hand gesture. */
{
  const path=[ // [px,py,z] top -> bottom; long sweeping arcs, curls at the conductor
    [305,470,-2.4],[262,510,-1.6],[196,562,-0.6],[136,640, 0.6],
    [106,730, 1.8],[118,815, 3.0],[162,882, 4.1],[150,930, 4.8],
    [205,988, 5.6],[320,1046,6.4],[465,1092,7.0],[600,1130,7.5],
  ].map(a=>posterAt(a[0],a[1],a[2]));
  buildRibbon(path, 0.9, 2.4, 1.7, {base:P.cream, deep:P.creamDeep, staff:true});

  /* conductor — tiny navy figure, arms raised (poster ~(152,932)) */
  const cp=posterAt(152,932,4.82); cp.y+=0.10;
  const g=new THREE.Group(); g.position.copy(cp); world.add(g);
  const nv=M.navyF();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.10,0.42,10),nv); body.position.y=0.21; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.095,12,9),nv); head.position.y=0.52; g.add(head);
  for(const s of [-1,1]){
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.30,6),nv);
    arm.position.set(s*0.13,0.46,0); arm.rotation.z=s*-0.7; g.add(arm);
  }
  const baton=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.24,5),M.yellow());
  baton.position.set(0.24,0.62,0); baton.rotation.z=-0.9; g.add(baton);
}

/* ---------- ZONE 2: horn city (lower-left) ----------
   HERO mass: thick triple-coil golden body + huge upward bell dominating the
   left zone; the miniature city is embedded inside and spills out of the coil. */
{
  const gold=M.yellow();
  const bodyP=posterAt(138,505,0.8);
  /* purple swash backdrop behind the horn (poster device) */
  const swash=put(blobShape(3.4,2.7,3.3,0.24),
    mat(P.mauveLight,P.mauveLight,P.mauveLight,{depth:0.25,mottle:0.06}),0,0,0);
  swash.position.copy(posterAt(150,545,-8));
  /* --- stylised horn: wound spiral coil, lead pipe, rotary valves, upward bell ---
     spirals drift in radius and depth so the coil feels designed, not mathematical */
  const spiral=(a0,sweep,r0,r1,z0,z1,ox=0,oy=0,wob=0.05)=>{
    const pts=[]; const N=56;
    for(let i=0;i<=N;i++){const t=i/N, a=a0+sweep*t;

/* clarinet: regular cylinder, barrel-joint rings, lower bell flare,
   sparse elegant keys on one axis with a single rod */
function clarinetTower(px,pyTop,pyBot,z,r){
  const top=posterAt(px,pyTop,z), bot=posterAt(px,pyBot,z);
  const h=top.y-bot.y;
  const g=new THREE.Group(); g.position.copy(bot); world.add(g);
  const nv=M.navyF();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.02,h*0.78,14),nv);
  body.position.y=h*0.56; g.add(body);
  const bellC=new THREE.Mesh(new THREE.CylinderGeometry(r*1.02,r*1.75,h*0.17,14),nv);
  bellC.position.y=h*0.085; g.add(bellC);
  for(const f of [0.42,0.68]){
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(r*1.14,r*1.14,0.09,14),M.creamF());
    ring.position.y=h*f; g.add(ring);
  }
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(r*0.9,r*1.05,h*0.06,12),nv);
  barrel.position.y=h*0.975; g.add(barrel);
  /* clarinet termination: stubby mouthpiece + ligature + tilted tip (no needle) */
  const mp=new THREE.Mesh(new THREE.CylinderGeometry(r*0.40,r*0.78,r*1.6,12),nv);
  mp.position.y=h+r*0.8; mp.rotation.z=0.10; g.add(mp);
  const lig=new THREE.Mesh(new THREE.CylinderGeometry(r*0.66,r*0.66,r*0.34,10),M.creamF());
  lig.position.y=h+r*0.42; g.add(lig);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(r*0.34,10,8),nv);
  tip.scale.set(1,0.55,1); tip.position.y=h+r*1.62; tip.rotation.z=0.3; g.add(tip);
  /* bell rim lip */
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(r*1.85,r*1.85,0.07,14),nv);
  rim.position.y=0.035; g.add(rim);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,h*0.5,6),M.creamF());
  rod.position.set(r*0.7,h*0.52,r*0.55); g.add(rod);
  for(let i=0;i<5;i++){
    const cup=new THREE.Mesh(new THREE.CircleGeometry(r*0.30,12),M.yellow());
    cup.position.set(r*0.18,h*(0.30+0.10*i),r+EPS); g.add(cup);
  }
  return g;
}
/* oboe: tapered delicate body, narrow bell, needle reed staple,
   clustered staggered keywork with double rods — ornate rhythm */
function oboeTower(px,pyTop,pyBot,z,r){
  const top=posterAt(px,pyTop,z), bot=posterAt(px,pyBot,z);
  const h=top.y-bot.y;
  const g=new THREE.Group(); g.position.copy(bot); world.add(g);
  const nv=M.navyF();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r*0.55,r*1.0,h*0.86,14),nv);
  body.position.y=h*0.52; g.add(body);
  const bellC=new THREE.Mesh(new THREE.CylinderGeometry(r*1.0,r*1.3,h*0.09,12),nv);
  bellC.position.y=h*0.045; g.add(bellC);
  /* oboe termination: short staple, cream thread wrap, flat double-reed blade */
  const staple=new THREE.Mesh(new THREE.CylinderGeometry(r*0.12,r*0.18,r*1.9,8),nv);
  staple.position.y=h+r*0.95; g.add(staple);
  const wrap=new THREE.Mesh(new THREE.CylinderGeometry(r*0.26,r*0.26,r*0.55,8),M.creamF());
  wrap.position.y=h+r*0.5; g.add(wrap);
  const reed=new THREE.Mesh(new THREE.BoxGeometry(r*0.52,r*1.15,r*0.10),M.blush());
  reed.position.y=h+r*2.4; g.add(reed);
  /* modest bell rim */
  const orim=new THREE.Mesh(new THREE.CylinderGeometry(r*1.38,r*1.38,0.05,12),nv);
  orim.position.y=0.025; g.add(orim);
  for(const f of [0.30,0.74]){
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(r*0.95,r*0.95,0.06,12),M.creamF());
    ring.position.y=h*f; g.add(ring);
  }
  for(const s of [-1,1]){
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,h*0.55,6),M.creamF());
    rod.position.set(s*r*0.55,h*0.5,r*0.5); g.add(rod);
  }
  const groups=[[0.22,3],[0.48,2],[0.66,3],[0.84,2]];
  for(const [f,n] of groups) for(let i=0;i<n;i++){
    const cup=new THREE.Mesh(new THREE.CircleGeometry(r*0.22,10),M.yellow());
    cup.position.set(((i%2)?1:-1)*r*0.22, h*(f+i*0.035), r*0.75+EPS); g.add(cup);
    if(i===0){
      const arm=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.16,0.035),M.creamF());
      arm.position.set(-r*0.4, h*(f+0.02), r*0.6); arm.rotation.z=0.8; g.add(arm);
    }
  }
  return g;
}

{
  /* stylised trombone bridge: inner+outer slide with sleeve step, U-bow,
     H-braces, bell tube making its U-turn at the near end */
  const gold=M.yellow();
  const a=posterAt(298,562,0.5), m=posterAt(432,514,0.45), b=posterAt(534,474,0.4);

    const dir=q.clone().sub(p), len=dir.length(), mid=p.clone().addScaledVector(dir,0.5);
    const g=new THREE.Group(); g.position.copy(mid); world.add(g);
    g.lookAt(q); g.rotateY(Math.PI/2);
    for(const off of [-0.17,0.17]){
      const t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12),gold);
      t.rotation.z=Math.PI/2; t.position.y=off; g.add(t);
    }
  };
  seg(a,m,0.105);          // inner slide (thinner)
  seg(m,b,0.14);           // outer slide (the sleeve step reads at a glance)
  /* U-bow closing the far end */
  const bow=new THREE.Group(); bow.position.copy(b); world.add(bow);
  bow.lookAt(b.clone().add(dirAB)); bow.rotateY(Math.PI/2);
  const bowT=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.135,10,18,Math.PI),gold);
  bowT.rotation.z=-Math.PI/2; bow.add(bowT);
  /* slide braces — the trombone 'H' */
  const brace=t=>{
    const g=new THREE.Group(); g.position.copy(a.clone().lerp(b,t)); world.add(g);
    g.lookAt(b); g.rotateY(Math.PI/2);

  lcol.position.copy(b).add(new THREE.Vector3(0.15,-1.3,0)); world.add(lcol);
  const fp=a.clone().lerp(b,0.62);
  const front=new THREE.Mesh(new THREE.BoxGeometry(0.55,2.6,0.5),M.mint());

/* ---------- ZONE 7: flute-key road (azure, cream-edged) ---------- */
{
  /* originates deep inside the right city, tight serpentine weave */
  const raw=[ // [px,py,z] top -> bottom
    [560,552,-4.0],[604,608,-2.8],[556,662,-1.6],[610,718,-0.4],
    [568,778, 0.8],[608,846, 2.0],[652,938, 3.0],[686,1040,3.8],
    [716,1140,4.4],
  ].map(a=>posterAt(a[0],a[1],a[2]));
  buildRibbon(raw, 0.6, 1.7, 1.2, {base:P.azure, deep:P.azureDeep, edge:true, tube:true});

  /* flute mechanics as street furniture: tone holes, key cups, arms, one long
     rod, an embouchure plate hidden at the head. Quiet on purpose — it must
     read as a road first and a flute second. */
  const fc=new THREE.CatmullRomCurve3(raw,false,'centripetal',0.5);
  const upv=new THREE.Vector3(0,1,0);
  const frame=t=>{
    const p=fc.getPoint(t), tan=fc.getTangent(t);
    const bin=new THREE.Vector3().crossVectors(upv,tan).normalize();
    return {p,tan,bin};
  };
  /* --- mechanics AS architecture, not decoration ---
     rods = raised rail edges on posts; cups = stepping platforms;
     tone holes = dark bore recesses; pivot barrels give mechanical rhythm */
  const widthAt=t=>0.6+(1.7-0.6)*Math.pow(t,1.2);
  for(const s of [-1,1]){
    const railPts=[]; for(let i=0;i<=48;i++){
      const t=0.10+(0.92-0.10)*i/48, f=frame(t);
      railPts.push(f.p.clone().addScaledVector(f.bin,s*(widthAt(t)/2+0.07))
        .add(new THREE.Vector3(0,0.11,0)));
    }
    tubeAlong(railPts,0.030,M.creamF(),false,96);
    for(let i=2;i<48;i+=6){
      const t=0.10+(0.92-0.10)*i/48, f=frame(t);
      const off=s*(widthAt(t)/2+0.07);
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.026,0.13,6),M.creamF());
      post.position.copy(f.p).addScaledVector(f.bin,off).add(new THREE.Vector3(0,0.05,0));
      world.add(post);
      if(i%12===2){ /* pivot barrel threaded on the rod */
        const piv=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.17,8),M.creamF());
        piv.position.copy(f.p).addScaledVector(f.bin,off).add(new THREE.Vector3(0,0.11,0));
        piv.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),f.tan.clone().normalize());
        world.add(piv);
      }
    }
  }
  const pattern=[ // [t, radius, kind] — flute-like 3/3/2/3 grouping
    [0.16,0.30,'cup'],[0.215,0.20,'hole'],[0.27,0.24,'cup'],
    [0.355,0.26,'cup'],[0.41,0.17,'hole'],[0.465,0.22,'cup'],
    [0.55,0.30,'cup'],[0.605,0.19,'hole'],
    [0.69,0.26,'cup'],[0.745,0.21,'hole'],[0.80,0.30,'cup'],
  ];
  const azd=mat(P.azureDeep,P.azureDeep,P.azureDeep);
  for(const [t,r,kind] of pattern){
    const f=frame(t);
    if(kind==='hole'){ /* tone hole: dark recess into the bore, cream lip */
      const lip=new THREE.Mesh(new THREE.RingGeometry(r*0.72,r,18),M.creamF());
      lip.rotation.x=-Math.PI/2; lip.position.copy(f.p).add(new THREE.Vector3(0,0.03,0)); world.add(lip);
      const bore=new THREE.Mesh(new THREE.CircleGeometry(r*0.72,16),M.navyF());
      bore.rotation.x=-Math.PI/2; bore.position.copy(f.p).add(new THREE.Vector3(0,0.032,0)); world.add(bore);
    }else{ /* key cup: raised stepping platform with pad + arm to the rail */
      const cup=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.06,0.10,18),M.creamF());
      cup.position.copy(f.p).add(new THREE.Vector3(0,0.05,0)); world.add(cup);
      const pad=new THREE.Mesh(new THREE.CircleGeometry(r*0.38,12),azd);
      pad.rotation.x=-Math.PI/2; pad.position.copy(f.p).add(new THREE.Vector3(0,0.104,0)); world.add(pad);
      const side=Math.sin(t*57)>0?1:-1;
      const armLen=Math.max(widthAt(t)/2+0.07-r*0.6,0.12);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(armLen,0.032,0.055),M.creamF());
      arm.position.copy(f.p).addScaledVector(f.bin,side*(r*0.6+armLen/2))
        .add(new THREE.Vector3(0,0.10,0));
      arm.rotation.y=Math.atan2(-f.bin.z,f.bin.x); world.add(arm);
    }
  }
  /* embouchure lip plate at the hidden head end — the reveal */
  {
    const f=frame(0.035);
    const plate=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.07,18),M.creamF());
    plate.scale.set(1.7,1,1.0);
    plate.position.copy(f.p).add(new THREE.Vector3(0,0.05,0));
    plate.rotation.y=Math.atan2(-f.tan.z,f.tan.x); world.add(plate);
    const hole=new THREE.Mesh(new THREE.CircleGeometry(0.10,14),M.navyF());
    hole.rotation.x=-Math.PI/2; hole.scale.x=1.5;
    hole.position.copy(f.p).add(new THREE.Vector3(0,0.095,0)); world.add(hole);
  }
  /* foot-joint cluster: stepped platform pucks at the viewer end */
  for(const [t,r,off] of [[0.875,0.15,0.22],[0.905,0.12,-0.18],[0.94,0.18,0.12]]){
    const f=frame(t);
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,0.09,14),M.creamF());
    cup.position.copy(f.p).addScaledVector(f.bin,off).add(new THREE.Vector3(0,0.045,0));
    world.add(cup);
  }
}

const camera=new THREE.OrthographicCamera();
const cur={az:base.az,el:base.el}, tgt={az:base.az,el:base.el};
function placeCamera(){
  const {az,el}=cur;
  camera.position.set(
    LOOK.x+DIST*Math.sin(az)*Math.cos(el),
    LOOK.y+DIST*Math.sin(el),
    LOOK.z+DIST*Math.cos(az)*Math.cos(el));
  camera.lookAt(LOOK);
}
function sizeCamera(){
  const aspect=innerWidth/innerHeight;
  let halfH, halfW;
  if(aspect>=CANON){ halfH=ORTHO_H/2;       halfW=halfH*aspect; }
  else             { halfW=ORTHO_H*CANON/2; halfH=halfW/aspect; }
  camera.top=halfH; camera.bottom=-halfH; camera.right=halfW; camera.left=-halfW;
  camera.near=1; camera.far=120; camera.updateProjectionMatrix();
}

/* ================= post: riso print pass (approved) ================= */
let rt=null;
const postScene=new THREE.Scene(), postCam=new THREE.Camera();
const postMat=new THREE.ShaderMaterial({
  uniforms:{ tScene:{value:null}, uRes:{value:new THREE.Vector2(1,1)} },
  vertexShader:/* glsl */`
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:/* glsl */`
    varying vec2 vUv; uniform sampler2D tScene; uniform vec2 uRes;
    ${NOISE}
    void main(){
      vec2 px=1.0/uRes;
      vec2 wob=vec2(vnoise(vUv*13.0), vnoise(vUv*13.0+31.7))-0.5;
      vec2 uv=vUv+wob*px*2.2;
      float r=texture2D(tScene,uv+vec2( 0.9,-0.5)*px).r;
      float g=texture2D(tScene,uv).g;
      float b=texture2D(tScene,uv+vec2(-0.8, 0.6)*px).b;
      vec3 col=vec3(r,g,b);
      float fine =hash(floor(vUv*uRes*0.75))-0.5;
      float fibre=fbm(vUv*vec2(210.0,120.0))-0.5;
      float blot =fbm(vUv*7.0)-0.5;
      col*=1.0+fine*0.09+fibre*0.075+blot*0.05;
      float f1=hash(floor(vUv*uRes*0.5)+7.3);
      if(f1>0.9965) col=mix(col,vec3(0.969,0.863,0.761),0.55);
      float f2=hash(floor(vUv*uRes*0.5)+3.1);
      if(f2>0.997) col*=0.72;
      float d=distance(vUv,vec2(0.5));
      col=mix(col,vec3(0.153,0.200,0.541),smoothstep(0.45,0.85,d)*0.14);
      gl_FragColor=vec4(col,1.0);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

/* ================= sizing (approved responsive cinematography) ================= */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h);
  sizeCamera();
  const ow=Math.min(w, h*CANON);
  const ov=document.getElementById('overlay');
  ov.style.width=ow+'px'; ov.style.height=(ow*1.5)+'px';
  const pw=Math.round(w*renderer.getPixelRatio()), ph=Math.round(h*renderer.getPixelRatio());
  if(rt) rt.dispose();
  rt=new THREE.WebGLRenderTarget(pw,ph,{samples:4});
  postMat.uniforms.tScene.value=rt.texture;
  postMat.uniforms.uRes.value.set(pw,ph);
}
addEventListener('resize',resize); resize();

/* ================= overlay UI ================= */
const overlay=document.getElementById('overlay');
const btn=document.getElementById('btnOverlay');
const slider=document.getElementById('opacity');
function setOverlay(on){
  overlay.style.display=on?'block':'none';
  btn.classList.toggle('on',on);
}
btn.onclick=()=>setOverlay(overlay.style.display==='none');
slider.oninput=()=>overlay.style.opacity=slider.value/100;
addEventListener('keydown',e=>{
  if(e.key==='o'||e.key==='O') setOverlay(overlay.style.display==='none');
});

/* ================= loop ================= */
function tick(){
  requestAnimationFrame(tick);
  cur.az+=(tgt.az-cur.az)*0.055; cur.el+=(tgt.el-cur.el)*0.055;
  placeCamera();
  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
}
tick();
</script>
